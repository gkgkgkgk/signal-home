<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal • Component playground</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f3eb;
        color: #25322c;
        font-family: system-ui, sans-serif;
        transition:
          background 0.25s,
          color 0.25s;
      }
      body.dark {
        background: #17251e;
        color: #f0f2e9;
      }
      main {
        max-width: 1180px;
        margin: auto;
        padding: 48px 24px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 36px;
      }
      h1 {
        font-size: clamp(32px, 5vw, 56px);
        letter-spacing: -2px;
        margin: 10px 0;
      }
      p {
        line-height: 1.6;
        max-width: 600px;
        opacity: 0.75;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 2px;
      }
      button {
        font: inherit;
        border: 1px solid #819487;
        border-radius: 50px;
        padding: 12px 20px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        min-height: 44px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        align-items: start;
      }
      .graphs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin: 24px 0;
      }
      h2 {
        margin: 40px 0 20px;
        font-size: 22px;
        letter-spacing: -0.6px;
      }
      footer {
        margin-top: 35px;
        opacity: 0.6;
        font-size: 12px;
      }
      @media (max-width: 850px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .graphs {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 540px) {
        main {
          padding: 28px 16px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        header {
          align-items: start;
        }
        header button {
          font-size: 12px;
          padding: 10px 14px;
          flex-shrink: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <span class="eyebrow">SIGNAL / THE COMPONENT COLLECTION</span>
          <h1>A little more alive.</h1>
          <p>
            Real controls. Soft color. Just enough motion.<br />Everything here
            is a demo — play freely.
          </p>
        </div>
        <button id="theme">Dark mode</button>
      </header>
      <section
        class="grid"
        id="controls"
        aria-label="Device controls"
      ></section>
      <h2>A clearer picture.</h2>
      <section class="graphs" id="graphs" aria-label="History graphs"></section>
      <section class="grid" id="metrics" aria-label="Sensor readings"></section>
      <footer>
        Built for touch, keyboard, and the everyday. Sample data only.
      </footer>
    </main>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
